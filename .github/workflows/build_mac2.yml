name: Build macOS Executable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter matplotlib pyinstaller

    - name: Build .app bundle with PyInstaller
      run: |
        python -m PyInstaller --noconfirm --onedir --windowed --collect-all customtkinter main.py

    - name: Install create-dmg tool
      run: brew install create-dmg

    - name: Create .dmg installer
      run: |
        create-dmg \
          --volname "Differential Calculus" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "main.app" 200 190 \
          --hide-extension "main.app" \
          --app-drop-link 600 190 \
          "DifferentialCalculus_Installer_macOS.dmg" \
          "dist/main.app"

    - name: Upload DMG Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macOS-Installer
        path: DifferentialCalculus_Installer_macOS.dmg
